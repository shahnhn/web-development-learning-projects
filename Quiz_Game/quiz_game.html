<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="screen active" id="start_screen">
            <h1>Quiz Time!</h1>
            <p>Test your knowledge with these fun questions</p>
            <button id="start_btn">Start Quiz</button>
        </div> 

        <div class="screen" id="quiz_screen">
            <div class="quiz_header">
                <h2 id="question">Question</h2>
                <div class="quiz_info">
                    <p>Question <span id="current_question">1</span> of <span id="total_questions">5</span></p>
                    <p>Score: <span id="score">0</span></p>
                </div>
            </div>
            
            <div id="answers_container" class="answers_container"></div>
            
            <div class="progress_bar">
                <div class="progress" id="progress"></div>
            </div>

        </div>

        <div id="result_screen" class="screen">
            <h1>Quiz Results</h1>
            <div class="result_info">
                <p>You scored <span id="final_score">0</span> out of <span id="max_score">5</span></p>
            </div>

            <div id="result_message">Good job!</div>

            <button id="restart_btn">Restart Quiz</button>
        </div>
    </div>
    <script src="quiz_game.js"></script>
</body>
</html>
